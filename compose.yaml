# LuyFlow API + PostgreSQL + Redis, built from this repository.
#   cp .env.example .env      # then fill in the required values (see README)
#   docker compose up -d --build --wait
#   -> http://localhost:3000  (Swagger: /api when NODE_ENV is not production)
#
# To run a published image instead of building:
#   LUYFLOW_IMAGE=ghcr.io/samnang-vouen/luyflow:<tag> docker compose up -d --no-build --wait

name: luyflow

services:
  api:
    build: .
    image: ${LUYFLOW_IMAGE:-luyflow:local}
    init: true
    ports:
      - "${API_PORT:-3000}:3000"
    env_file: .env
    environment:
      # Set for the containers below; the matching values in .env are for running without Docker.
      PORT: 3000
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Stop early with a clear message if a required value is missing.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Health check comes from the image (GET /).
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    # Append-only file so queued background jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
