# CI for LuyFlow
#   Pull request to main : lint, build, unit + e2e tests, Docker build (no push)
#   Push to main         : the above, then push ghcr.io/samnang-vouen/luyflow:sha-<commit> and :latest,
#                          then smoke-test that image with compose.yaml
#   Tag vX.Y.Z           : same, plus :X.Y.Z and :X.Y
name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/samnang-vouen/luyflow

jobs:
  test:
    name: Lint, build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: luyflow
          POSTGRES_PASSWORD: luyflow
          POSTGRES_DB: luyflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U luyflow -d luyflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: luyflow
      DATABASE_PASSWORD: luyflow
      DATABASE_NAME: luyflow
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci-access-secret-not-for-real-use
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-real-use
      JWT_REFRESH_TTL: 604800
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Apply migrations
        run: npm run typeorm -- migration:run
      - name: E2E tests (PostgreSQL)
        run: npm run test:e2e
        env:
          RUN_DATABASE_TESTS: '1'

  image:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha-tag: ${{ steps.sha.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Short SHA tag
        id: sha
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build (and push unless pull request)
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests only check that the image builds; amd64 is enough for that.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke-test the pushed image
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create .env from .env.example
        run: |
          cp .env.example .env
          sed -i "s/^DATABASE_PASSWORD=.*/DATABASE_PASSWORD=smoke-$(openssl rand -hex 8)/" .env
          sed -i "s/^JWT_ACCESS_SECRET=.*/JWT_ACCESS_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^JWT_REFRESH_SECRET=.*/JWT_REFRESH_SECRET=$(openssl rand -hex 32)/" .env
      - name: Start the stack from the pushed image
        env:
          LUYFLOW_IMAGE: ${{ env.IMAGE }}:${{ needs.image.outputs.sha-tag }}
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: API answers and migrations ran
        run: |
          curl --fail --silent --show-error http://localhost:3000/
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select count(*) from migrations"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
